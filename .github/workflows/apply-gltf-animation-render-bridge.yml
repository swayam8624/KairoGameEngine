name: Apply glTF Animation Render Bridge
on:
  push:
    branches: [feature/gltf-animation-render-bridge]
    paths: ['.github/workflows/apply-gltf-animation-render-bridge.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/gltf-animation-render-bridge
      - run: python3 .github/scripts/apply_gltf_animation_render_bridge.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Runtime: bridge glTF animation and skinning into render extraction"
          git push origin HEAD:feature/gltf-animation-render-bridge
