name: Racing Port Compile

on:
  push:
    branches:
      - port/pmndrs-racing-kairo
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    name: Ubuntu Clang Racing Target
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Materialize locked KAIRO workspace
        shell: bash
        run: |
          bash scripts/materialize_workspace_lock.sh
          bash scripts/verify_workspace_lock.sh
      - name: Install build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build libglfw3-dev libgl1-mesa-dev libvulkan-dev glslang-tools mesa-vulkan-drivers xvfb blender
      - name: Prepare real PMNDRS racing assets
        shell: bash
        run: |
          git clone --depth 1 https://github.com/pmndrs/racing-game.git "$RUNNER_TEMP/racing-game"
          KAIRO_RACING_UPSTREAM="$RUNNER_TEMP/racing-game" \
          KAIRO_BLENDER="$(command -v blender)" \
            bash Samples/KairoRacingGame/tools/prepare_assets.sh
          test -s Samples/KairoRacingGame/Project/Content/Racing/track.glb
          test -s Samples/KairoRacingGame/Project/Content/Racing/chassis.glb
          test -s Samples/KairoRacingGame/Project/Content/Racing/wheel.glb
      - name: Configure
        shell: bash
        env:
          CC: clang
          CXX: clang++
        run: cmake --preset ci-clang -DKAIRO_GAME_ENGINE_BUILD_RACING_SAMPLE=ON
      - name: Compile Editor, Player, and native KAIRO racing game
        shell: bash
        run: |
          cmake --build --preset ci-clang --target KairoEditorApp KairoPlayer KairoRacingGame --parallel
      - name: Run Editor/Core regression tests
        shell: bash
        run: |
          ctest --test-dir build/ci-clang \
            -R 'KairoEngineCore|KairoEditorTests|KairoEditorPhase4Tests|KairoEditorUITests' \
            --output-on-failure
      - name: Validate and smoke the real racing port
        shell: bash
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1600x900x24" \
            ctest --test-dir build/ci-clang \
              -R '^KairoRacing\.' \
              --output-on-failure
