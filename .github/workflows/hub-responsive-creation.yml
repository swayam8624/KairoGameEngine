name: Hub responsive creation regression

on:
  pull_request:
    paths:
      - 'scripts/kairo_hub.py'
      - 'scripts/kairo_hub_core.py'
      - 'scripts/kairo_project_workflow.py'
      - 'scripts/tests/test_hub_workbench.py'
      - 'scripts/tests/test_workbench_package.py'
      - 'scripts/tests/test_hub_layout.py'
      - 'Samples/World2DProject/**'
      - 'Samples/SignalVault/**'
      - 'scripts/tests/test_signal_vault_template.py'
      - '.github/workflows/hub-responsive-creation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tk-layout-and-create:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install graphical test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb xauth fonts-dejavu-core
      - name: Exercise real Tk layout and project creation
        run: PYTHONPATH=scripts PYTHONDONTWRITEBYTECODE=1 xvfb-run -a /usr/bin/python3 -B scripts/tests/test_hub_layout.py -v
      - name: Exercise real Hub to Workbench process handoff
        run: PYTHONPATH=scripts PYTHONDONTWRITEBYTECODE=1 xvfb-run -a /usr/bin/python3 -B scripts/tests/test_hub_workbench.py -v
      - name: Exercise repeat packaging intent and Workbench layout
        run: PYTHONPATH=scripts PYTHONDONTWRITEBYTECODE=1 xvfb-run -a /usr/bin/python3 -B scripts/tests/test_workbench_package.py -v
      - name: Exercise creation of the complete reference game
        run: PYTHONPATH=scripts PYTHONDONTWRITEBYTECODE=1 xvfb-run -a /usr/bin/python3 -B scripts/tests/test_signal_vault_template.py -v
