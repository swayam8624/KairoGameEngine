name: Build, Test, and Package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  superbuild:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu Clang
            os: ubuntu-latest
            platform: linux
            preset: ci-clang
          - name: Ubuntu ASan + UBSan
            os: ubuntu-latest
            platform: linux
            preset: ci-sanitized
          - name: macOS Clang
            os: macos-latest
            platform: macos
            preset: ci-clang
          - name: Windows Runtime MSVC
            os: windows-2022
            platform: windows
            preset: ci-msvc

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Initialize MSVC environment
        if: matrix.platform == 'windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y clang ninja-build libglfw3-dev libgl1-mesa-dev libvulkan-dev glslang-tools xvfb
          echo "KAIRO_CXX_COMPILER=$(command -v clang++)" >> "$GITHUB_ENV"

      - name: Install macOS dependencies
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          brew update
          brew install cmake ninja llvm glfw vulkan-headers vulkan-loader molten-vk shaderc glslang
          echo "KAIRO_CXX_COMPILER=$(brew --prefix llvm)/bin/clang++" >> "$GITHUB_ENV"

      - name: Install Windows dependencies
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          choco install ninja vulkan-sdk -y --no-progress
          $vcpkg = "$env:VCPKG_INSTALLATION_ROOT"
          if (-not $vcpkg) { $vcpkg = "C:\vcpkg" }
          if (-not (Test-Path $vcpkg)) {
            git clone https://github.com/microsoft/vcpkg.git $vcpkg
          }
          & "$vcpkg\bootstrap-vcpkg.bat" -disableMetrics
          & "$vcpkg\vcpkg.exe" install glfw3 vulkan-headers vulkan-loader --triplet x64-windows
          $glslangValidator = Get-ChildItem -Path "C:\VulkanSDK" -Filter glslangValidator.exe -Recurse | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $glslangValidator) { throw "The Vulkan SDK did not provide glslangValidator.exe" }
          "CMAKE_PREFIX_PATH=$vcpkg\installed\x64-windows" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$vcpkg\installed\x64-windows\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          $glslangValidator.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Configure
        shell: bash
        run: |
          # Homebrew Clang's standard C++ module SourceLocation address space is
          # finite. Pulling the offline CPU raytracer into the already-large
          # native editor TU crosses that frontend limit on current macOS runners.
          # Linux and Windows retain full offline-render superbuild coverage;
          # macOS still builds/tests the native editor, player, renderer, physics,
          # assets, AI, ECS, reflection, EngineCore, and realtime render bridge.
          if [[ "${{ matrix.platform }}" == "macos" ]]; then
            cmake --preset ${{ matrix.preset }} -DKAIRO_GAME_ENGINE_BUILD_RAYTRACER=OFF
          else
            cmake --preset ${{ matrix.preset }}
          fi

      - name: Build
        id: build
        shell: bash
        run: |
          set -o pipefail
          cmake --build --preset ${{ matrix.preset }} --parallel 2 2>&1 | tee build-${{ matrix.preset }}.log

      - name: Upload build diagnostics
        if: failure() && steps.build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: KairoGameEngine-build-${{ matrix.platform }}-${{ matrix.preset }}
          path: build-${{ matrix.preset }}.log
          if-no-files-found: error

      - name: Test on Linux virtual display
        id: test_linux
        if: matrix.platform == 'linux'
        shell: bash
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          set -o pipefail
          xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" \
            ctest --preset ${{ matrix.preset }} --output-on-failure 2>&1 | tee test-${{ matrix.preset }}.log

      - name: Test on macOS
        id: test_macos
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -o pipefail
          # GitHub-hosted macOS runners have no interactive WindowServer session,
          # so GLFW/OpenGL window smoke tests cannot create a native window. The
          # Metal-native smoke tests remain enabled and cover the actual macOS
          # renderer/player/editor integration path.
          ctest --preset ${{ matrix.preset }} --output-on-failure \
            -E 'KairoSharedContentPlayerSmoke|KairoEditorOpenGLSharedContentSmoke|KairoPlayerOpenGLSharedContentSmoke' \
            2>&1 | tee test-${{ matrix.preset }}.log

      - name: Test on Windows
        id: test_windows
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          set -o pipefail
          ctest --preset ${{ matrix.preset }} --output-on-failure 2>&1 | tee test-${{ matrix.preset }}.log

      - name: Upload test diagnostics
        if: failure() && (steps.test_linux.outcome == 'failure' || steps.test_macos.outcome == 'failure' || steps.test_windows.outcome == 'failure')
        uses: actions/upload-artifact@v4
        with:
          name: KairoGameEngine-test-${{ matrix.platform }}-${{ matrix.preset }}
          path: test-${{ matrix.preset }}.log
          if-no-files-found: error

      - name: Create source package
        if: matrix.platform == 'linux' && matrix.preset == 'ci-clang'
        shell: bash
        run: cpack --config build/ci-clang/CPackSourceConfig.cmake -G TGZ

      - name: Upload source package
        if: matrix.platform == 'linux' && matrix.preset == 'ci-clang'
        uses: actions/upload-artifact@v4
        with:
          name: KairoGameEngine-source
          path: KairoGameEngine-*-Source.tar.gz
          if-no-files-found: error
