      - 'Runtime/KairoPlayer/tests/TerrainGenerationQueueTests.cpp'
      - 'Runtime/KairoPlayer/TerrainNativeStore.hpp'
      - 'Runtime/KairoPlayer/RuntimeProceduralTerrainBridge.cppm'
      - 'Runtime/KairoPlayer/TerrainDemo.cpp'
      - 'Runtime/KairoPlayer/tests/TerrainNativeStoreTests.cpp'
      - 'Runtime/KairoPlayer/CMakeLists.txt'
      - 'scripts/run_craft_cpu_contracts.sh'
      - 'scripts/StageCraftPlaytest.cmake'
      - '.github/workflows/procedural-terrain-viewport.yml'
permissions:
  contents: read
jobs:
  ownership:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate native handle ownership under sanitizers
        run: |
          g++ -std=c++23 -Wall -Wextra -Wpedantic -Werror -g -O1 -fsanitize=address,undefined -fno-omit-frame-pointer Runtime/KairoPlayer/tests/TerrainNativeStoreTests.cpp -o /tmp/terrain-native-test
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 /tmp/terrain-native-test
      - name: Validate bounded worker queue under sanitizers
        run: |
          g++ -std=c++23 -Wall -Wextra -Wpedantic -Werror -g -O1 -pthread -fsanitize=address,undefined -fno-omit-frame-pointer Runtime/KairoPlayer/tests/TerrainGenerationQueueTests.cpp -o /tmp/terrain-queue-test
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 /tmp/terrain-queue-test
      - name: Validate large-world precision under sanitizers
        run: |
          g++ -std=c++23 -Wall -Wextra -Wpedantic -Werror -g -O1 -fsanitize=address,undefined -fno-omit-frame-pointer Runtime/KairoPlayer/tests/TerrainRenderOriginTests.cpp -o /tmp/terrain-origin-test
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 /tmp/terrain-origin-test
      - name: Validate cached error profiles under sanitizers
        run: |
          g++ -std=c++23 -Wall -Wextra -Wpedantic -Werror -g -O1 -fsanitize=address,undefined -fno-omit-frame-pointer Runtime/KairoPlayer/tests/TerrainErrorProfileTests.cpp -o /tmp/terrain-error-profile-test
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 /tmp/terrain-error-profile-test
      - name: Verify camera projected error estimate under sanitizers
        run: |
          g++ -std=c++23 -Wall -Wextra -Wpedantic -Werror -g -O1 -fsanitize=address,undefined -fno-omit-frame-pointer Runtime/KairoPlayer/tests/TerrainScreenErrorTests.cpp -o /tmp/terrain-screen-error-test
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 /tmp/terrain-screen-error-test
      - name: Validate terrain walking contract under sanitizers
        run: |
          g++ -std=c++23 -Wall -Wextra -Wpedantic -Werror -g -O1 -fsanitize=address,undefined -fno-omit-frame-pointer Runtime/KairoPlayer/tests/TerrainWalkerTests.cpp -o /tmp/terrain-walker-test
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 /tmp/terrain-walker-test
      - name: Require all Craft CPU contracts under sanitizers
        run: CXX=g++ bash scripts/run_craft_cpu_contracts.sh
  native-vulkan:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Materialize exact locked workspace
        run: |
          set -euo pipefail
          repos=(KairoMath KairoGeometry KairoSpatial KairoPhysicsMath KairoPhysicsEngine KairoAssets KairoAI KairoECS KairoReflection KairoEngineCore KairoRenderer KairoEditor)
          bash scripts/materialize_workspace_lock.sh "${repos[@]}"
          bash scripts/verify_workspace_lock.sh "${repos[@]}"
      - name: Install native software Vulkan and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang ninja-build libglfw3-dev libgl1-mesa-dev libvulkan-dev glslang-tools xvfb xauth mesa-vulkan-drivers vulkan-tools vulkan-validationlayers
          echo "KAIRO_CXX_COMPILER=$(command -v clang++)" >> "$GITHUB_ENV"
          icd="$(find /usr/share/vulkan/icd.d -maxdepth 1 -name '*lvp*.json' -print -quit)"
          test -n "$icd"
          echo "VK_DRIVER_FILES=$icd" >> "$GITHUB_ENV"
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
      - name: Compile procedural viewport against exact locked dependencies
        run: |
          cmake --preset game-player-clang -DKAIRO_PLAYER_BUILD_PROCEDURAL_TERRAIN=ON -DKAIRO_GAME_ENGINE_BUILD_PHASE1_SAMPLE=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build --preset game-player-clang --parallel 2 --target KairoCraftCombatHudTests KairoCraftCombatRewardTests KairoCraftCreatureNavigationTests KairoCraftCreatureTests KairoCraftAutosaveTests KairoCraftTargetFeedbackTests KairoCraftDaylightTests KairoCraftSaveFileTests KairoCraftSurvivalJourneyTests KairoCraftActionLatchTests KairoCraftSurfaceSpawnTests KairoCraftNutritionTests KairoCraftMouseLookTests KairoCraftEquipmentEnvelopeTests KairoCraftEquipmentTests KairoCraftMiningTests KairoCraftVitalsTests KairoCraftHudPublicationTests KairoCraftHudProjectionTests KairoCraftRecipesHudTests KairoCraftCaves KairoCraftCaveWorldTests KairoCraftStream KairoCraftInventoryTests KairoCraftMeshBatchTests KairoCraftStreamSaveTests KairoCraft KairoCraftStreamingWindowTests KairoVoxelPlayerTests KairoCraftSaveTests KairoVoxelMeshPublicationTests KairoCraftWorldTests KairoVoxelChunkSurfaceTests KairoVoxelInteractionTests KairoTerrainDemo KairoTerrainExplorer KairoTerrainWalkerTests KairoTerrainNativeStoreTests KairoTerrainGenerationQueueTests KairoTerrainRenderOriginTests KairoTerrainErrorProfileTests KairoTerrainScreenErrorTests
      - name: Run required native streamed-terrain capture
        run: |
          set -euo pipefail
          mkdir -p build/terrain-diagnostics
          ctest --test-dir build/game-player-clang -R '^Kairo(Terrain(NativeStore|GenerationQueue|RenderOrigin|ErrorProfile|ScreenError|Walker)|VoxelInteraction|VoxelChunkSurface|CraftWorld|VoxelMeshPublication|CraftSave|VoxelPlayer|CraftStreamingWindow|CraftStreamSave|CraftMeshBatch|CraftInventory|CraftCaveWorld|CraftRecipesHud|CraftHudProjection|CraftHudPublication|CraftVitals|CraftMining|CraftEquipment|CraftEquipmentEnvelope|CraftMouseLook|CraftNutrition|CraftSurfaceSpawn|CraftActionLatch|CraftSurvivalJourney|CraftSaveFile|CraftDaylight|CraftTargetFeedback|CraftAutosave|CraftCreature|CraftCreatureNavigation|CraftCombatReward|CraftCombatHud)Tests$' --no-tests=error --output-on-failure
          export VK_INSTANCE_LAYERS=VK_LAYER_KHRONOS_validation
          xvfb-run -a --server-args="-screen 0 1280x1024x24" build/game-player-clang/Runtime/KairoPlayer/KairoTerrainDemo --renderer vulkan --seed 42 --smoke 2>&1 | tee build/terrain-diagnostics/smoke.log
          xvfb-run -a --server-args="-screen 0 1280x1024x24" build/game-player-clang/Runtime/KairoPlayer/KairoTerrainDemo --renderer vulkan --seed 42 --smoke --async 2>&1 | tee build/terrain-diagnostics/async-smoke.log
          xvfb-run -a --server-args="-screen 0 1280x1024x24" build/game-player-clang/Runtime/KairoPlayer/KairoTerrainDemo --renderer vulkan --seed 42 --smoke --workers 4 2>&1 | tee build/terrain-diagnostics/pool-smoke.log
          xvfb-run -a --server-args="-screen 0 1280x1024x24" build/game-player-clang/Runtime/KairoPlayer/KairoTerrainDemo --renderer vulkan --seed 42 --smoke --workers 4 --far-origin 2>&1 | tee build/terrain-diagnostics/far-smoke.log
          xvfb-run -a --server-args="-screen 0 1280x1024x24" build/game-player-clang/Runtime/KairoPlayer/KairoTerrainDemo --renderer vulkan --seed 42 --smoke --workers 4 --lod 2>&1 | tee build/terrain-diagnostics/lod-smoke.log
          xvfb-run -a --server-args="-screen 0 1280x1024x24" build/game-player-clang/Runtime/KairoPlayer/KairoTerrainDemo --renderer vulkan --seed 42 --smoke --workers 4 --error-mm 1000 2>&1 | tee build/terrain-diagnostics/error-smoke.log
          xvfb-run -a --server-args="-screen 0 1280x1024x24" build/game-player-clang/Runtime/KairoPlayer/KairoTerrainDemo --renderer vulkan --seed 42 --smoke --workers 4 --screen-px 20 2>&1 | tee build/terrain-diagnostics/screen-smoke.log
          xvfb-run -a --server-args="-screen 0 1280x1024x24" build/game-player-clang/Runtime/KairoPlayer/KairoTerrainExplorer --renderer vulkan --seed 42 --smoke 2>&1 | tee build/terrain-diagnostics/explorer-smoke.log
          xvfb-run -a --server-args="-screen 0 1280x1024x24" build/game-player-clang/Runtime/KairoPlayer/KairoCraft --renderer vulkan --seed 42 --smoke 2>&1 | tee build/terrain-diagnostics/craft-smoke.log
          xvfb-run -a --server-args="-screen 0 1280x1024x24" build/game-player-clang/Runtime/KairoPlayer/KairoCraft --renderer vulkan --seed 42 --survival --smoke 2>&1 | tee build/terrain-diagnostics/craft-survival-smoke.log
          xvfb-run -a --server-args="-screen 0 1280x1024x24" build/game-player-clang/Runtime/KairoPlayer/KairoCraftStream --renderer vulkan --seed 42 --survival --smoke 2>&1 | tee build/terrain-diagnostics/craft-stream-smoke.log
          xvfb-run -a --server-args="-screen 0 1280x1024x24" build/game-player-clang/Runtime/KairoPlayer/KairoCraftStream --renderer vulkan --seed 42 --survival --workers 4 --uploads 2 --smoke 2>&1 | tee build/terrain-diagnostics/craft-async-smoke.log
          xvfb-run -a --server-args="-screen 0 1280x1024x24" build/game-player-clang/Runtime/KairoPlayer/KairoCraftCaves --renderer vulkan --seed 42 --smoke 2>&1 | tee build/terrain-diagnostics/craft-caves-smoke.log
          if grep -E 'Validation Error|VUID-.*ERROR|UNASSIGNED-.*ERROR' build/terrain-diagnostics/*smoke.log; then exit 1; fi
      - name: Require copied Craft binaries from a relocated development bundle
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/kairo-craft-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          player="$PWD/build/game-player-clang/Runtime/KairoPlayer"
          diagnostics="$PWD/build/terrain-diagnostics"
          cmake "-DSURFACE=$player/KairoCraftStream" "-DCAVES=$player/KairoCraftCaves" "-DOUTPUT=$bundle" "-DENGINE_REVISION=$(git rev-parse HEAD)" "-DRENDERER_REVISION=$(awk '$1=="KairoRenderer"{print $2}' workspace.lock)" -P scripts/StageCraftPlaytest.cmake
          cp "$bundle/manifest.txt" "$diagnostics/craft-bundle-manifest.txt"
          cd "$bundle"
          tail -n2 manifest.txt | sha256sum -c -
          export VK_INSTANCE_LAYERS=VK_LAYER_KHRONOS_validation
          xvfb-run -a --server-args="-screen 0 1280x1024x24" ./run-surface.sh --renderer vulkan --seed 42 --survival --smoke 2>&1 | tee "$diagnostics/relocated-surface.log"
          xvfb-run -a --server-args="-screen 0 1280x1024x24" ./run-caves.sh --renderer vulkan --seed 42 --smoke 2>&1 | tee "$diagnostics/relocated-caves.log"
          if grep -E 'Validation Error|VUID-.*ERROR|UNASSIGNED-.*ERROR' "$diagnostics"/relocated-*.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: streamed-terrain-diagnostics
          path: build/terrain-diagnostics/
          if-no-files-found: warn
  native-metal:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Materialize and verify exact candidate lock
        run: |
          set -euo pipefail
          repos=(KairoMath KairoGeometry KairoSpatial KairoPhysicsMath KairoPhysicsEngine KairoAssets KairoAI KairoECS KairoReflection KairoEngineCore KairoRenderer KairoEditor)
          bash scripts/materialize_workspace_lock.sh "${repos[@]}"
          bash scripts/verify_workspace_lock.sh "${repos[@]}"
      - name: Install native macOS build dependencies
        run: |
          set -euo pipefail
          brew update
          brew install cmake ninja llvm glfw vulkan-headers vulkan-loader molten-vk shaderc glslang
          echo "KAIRO_CXX_COMPILER=$(brew --prefix llvm)/bin/clang++" >> "$GITHUB_ENV"
      - name: Run exact-lock native Metal gameplay acceptance
        env:
          KAIRO_METAL_LOG_DIR: build/metal-diagnostics
        run: |
          bash -n scripts/run_native_metal_gameplay_acceptance.sh
          bash scripts/run_native_metal_gameplay_acceptance.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: locked-metal-gameplay-diagnostics
          path: build/metal-diagnostics/
          if-no-files-found: warn
