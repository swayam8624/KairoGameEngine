name: Procedural terrain viewport
on:
  push:
    branches: [main, integration/merged-terrain-renderer, feat/terrain-live-lod, feat/terrain-error-aware-lod, feat/terrain-screen-error, feat/terrain-explorer, feat/terrain-explorer-jump, feat/voxel-world-interaction, feat/voxel-chunk-meshing, feat/voxel-native-mesh, feat/craft-interactive-native, feat/craft-world-saves, feat/craft-survival-controller, feat/craft-streaming-window, feat/craft-streamed-native, feat/craft-stream-survival-save, feat/craft-async-meshing, feat/craft-survival-inventory, feat/craft-upload-budget, feat/craft-vertical-caves, feat/craft-recipes-hud, feat/craft-cave-survival-session, integration/gameplay-native-candidate, feat/craft-responsive-hud, feat/craft-vulkan-overlay, feat/craft-native-hud-parity, feat/craft-hud-publication, feat/craft-survival-vitals, feat/craft-timed-mining, feat/craft-equipment, feat/craft-visible-game-candidate, feat/craft-fps-controls, feat/craft-nutrition, feat/craft-file-transactions, feat/craft-playtest-bundle, feat/craft-daylight, feat/craft-target-feedback, feat/craft-autosave, feat/craft-creatures, feat/craft-creature-navigation, feat/craft-combat-rewards]
