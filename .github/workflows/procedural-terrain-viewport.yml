name: Procedural terrain viewport
on:
  push:
    branches: [main, integration/merged-terrain-renderer, feat/terrain-live-lod, feat/terrain-error-aware-lod, feat/terrain-screen-error, feat/terrain-explorer, feat/terrain-explorer-jump, feat/voxel-world-interaction, feat/voxel-chunk-meshing, feat/voxel-native-mesh, feat/craft-interactive-native, feat/craft-world-saves, feat/craft-survival-controller, feat/craft-streaming-window, feat/craft-streamed-native, feat/craft-stream-survival-save, feat/craft-async-meshing, feat/craft-survival-inventory, feat/craft-upload-budget, feat/craft-vertical-caves, feat/craft-recipes-hud, feat/craft-cave-survival-session, integration/gameplay-native-candidate, feat/craft-responsive-hud, feat/craft-vulkan-overlay, feat/craft-native-hud-parity, feat/craft-hud-publication, feat/craft-survival-vitals, feat/craft-timed-mining, feat/craft-equipment, feat/craft-visible-game-candidate]
  pull_request:
    paths:
      - 'workspace.lock'
      - 'scripts/run_native_metal_gameplay_acceptance.sh'
      - 'Runtime/KairoPlayer/CraftRecipesHud.hpp'
      - 'Runtime/KairoPlayer/CraftHudProjection.hpp'
      - 'Runtime/KairoPlayer/CraftHudPublication.hpp'
      - 'Runtime/KairoPlayer/CraftVitals.hpp'
      - 'Runtime/KairoPlayer/CraftMining.hpp'
      - 'Runtime/KairoPlayer/CraftEquipment.hpp'
      - 'Runtime/KairoPlayer/CraftEquipmentSave.hpp'
      - 'Runtime/KairoPlayer/tests/CraftEquipmentTests.cpp'
      - 'Runtime/KairoPlayer/tests/CraftEquipmentEnvelopeTests.cpp'
      - 'Runtime/KairoPlayer/tests/CraftMiningTests.cpp'
      - 'Runtime/KairoPlayer/tests/CraftVitalsTests.cpp'
      - 'Runtime/KairoPlayer/tests/CraftHudPublicationTests.cpp'
      - 'Runtime/KairoPlayer/tests/CraftHudProjectionTests.cpp'
      - 'Runtime/KairoPlayer/tests/CraftRecipesHudTests.cpp'
      - 'Runtime/KairoPlayer/CraftCaveSession.hpp'
      - 'Runtime/KairoPlayer/CraftCaveSpawn.hpp'
      - 'Runtime/KairoPlayer/CraftCaveWorld.hpp'
      - 'Runtime/KairoPlayer/CraftCaveDemo.cpp'
      - 'Runtime/KairoPlayer/tests/CraftCaveWorldTests.cpp'
      - 'Runtime/KairoPlayer/CraftInventory.hpp'
      - 'Runtime/KairoPlayer/tests/CraftInventoryTests.cpp'
      - 'Runtime/KairoPlayer/CraftMeshBatch.hpp'
      - 'Runtime/KairoPlayer/tests/CraftMeshBatchTests.cpp'
      - 'Runtime/KairoPlayer/CraftStreamSave.hpp'
      - 'Runtime/KairoPlayer/tests/CraftStreamSaveTests.cpp'
      - 'Runtime/KairoPlayer/CraftStreamDemo.cpp'
      - 'Runtime/KairoPlayer/CraftStreamingWindow.hpp'
      - 'Runtime/KairoPlayer/tests/CraftStreamingWindowTests.cpp'
      - 'Runtime/KairoPlayer/VoxelPlayer.hpp'
      - 'Runtime/KairoPlayer/tests/VoxelPlayerTests.cpp'
      - 'Runtime/KairoPlayer/CraftSave.hpp'
      - 'Runtime/KairoPlayer/tests/CraftSaveTests.cpp'
      - 'Runtime/KairoPlayer/CraftDemo.cpp'
      - 'Runtime/KairoPlayer/VoxelMeshPublication.hpp'
      - 'Runtime/KairoPlayer/tests/VoxelMeshPublicationTests.cpp'
      - 'Runtime/KairoPlayer/CraftWorld.hpp'
      - 'Runtime/KairoPlayer/tests/CraftWorldTests.cpp'
      - 'Runtime/KairoPlayer/VoxelChunkSurface.hpp'
      - 'Runtime/KairoPlayer/tests/VoxelChunkSurfaceTests.cpp'
      - 'Runtime/KairoPlayer/VoxelInteraction.hpp'
      - 'Runtime/KairoPlayer/tests/VoxelInteractionTests.cpp'
      - 'Runtime/KairoPlayer/TerrainWalker.hpp'
      - 'Runtime/KairoPlayer/TerrainExplorer.cpp'
      - 'Runtime/KairoPlayer/tests/TerrainWalkerTests.cpp'
      - 'Runtime/KairoPlayer/TerrainScreenError.hpp'
      - 'Runtime/KairoPlayer/tests/TerrainScreenErrorTests.cpp'
      - 'Runtime/KairoPlayer/TerrainErrorProfile.hpp'
      - 'Runtime/KairoPlayer/tests/TerrainErrorProfileTests.cpp'
      - 'Runtime/KairoPlayer/TerrainRenderOrigin.hpp'
      - 'Runtime/KairoPlayer/tests/TerrainRenderOriginTests.cpp'
      - 'Runtime/KairoPlayer/TerrainGenerationQueue.hpp'
      - 'Runtime/KairoPlayer/tests/TerrainGenerationQueueTests.cpp'
      - 'Runtime/KairoPlayer/TerrainNativeStore.hpp'
      - 'Runtime/KairoPlayer/RuntimeProceduralTerrainBridge.cppm'
      - 'Runtime/KairoPlayer/TerrainDemo.cpp'
      - 'Runtime/KairoPlayer/tests/TerrainNativeStoreTests.cpp'
      - 'Runtime/KairoPlayer/CMakeLists.txt'
      - '.github/workflows/procedural-terrain-viewport.yml'
permissions:
  contents: read
jobs:
  ownership:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate native handle ownership under sanitizers
        run: |
          g++ -std=c++23 -Wall -Wextra -Wpedantic -Werror -g -O1 -fsanitize=address,undefined -fno-omit-frame-pointer Runtime/KairoPlayer/tests/TerrainNativeStoreTests.cpp -o /tmp/terrain-native-test
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 /tmp/terrain-native-test
      - name: Validate bounded worker queue under sanitizers
        run: |
          g++ -std=c++23 -Wall -Wextra -Wpedantic -Werror -g -O1 -pthread -fsanitize=address,undefined -fno-omit-frame-pointer Runtime/KairoPlayer/tests/TerrainGenerationQueueTests.cpp -o /tmp/terrain-queue-test
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 /tmp/terrain-queue-test
      - name: Validate large-world precision under sanitizers
        run: |
          g++ -std=c++23 -Wall -Wextra -Wpedantic -Werror -g -O1 -fsanitize=address,undefined -fno-omit-frame-pointer Runtime/KairoPlayer/tests/TerrainRenderOriginTests.cpp -o /tmp/terrain-origin-test
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 /tmp/terrain-origin-test
      - name: Validate cached error profiles under sanitizers
        run: |
          g++ -std=c++23 -Wall -Wextra -Wpedantic -Werror -g -O1 -fsanitize=address,undefined -fno-omit-frame-pointer Runtime/KairoPlayer/tests/TerrainErrorProfileTests.cpp -o /tmp/terrain-error-profile-test
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 /tmp/terrain-error-profile-test
      - name: Verify camera projected error estimate under sanitizers
        run: |
          g++ -std=c++23 -Wall -Wextra -Wpedantic -Werror -g -O1 -fsanitize=address,undefined -fno-omit-frame-pointer Runtime/KairoPlayer/tests/TerrainScreenErrorTests.cpp -o /tmp/terrain-screen-error-test
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 /tmp/terrain-screen-error-test
      - name: Validate terrain walking contract under sanitizers
        run: |
          g++ -std=c++23 -Wall -Wextra -Wpedantic -Werror -g -O1 -fsanitize=address,undefined -fno-omit-frame-pointer Runtime/KairoPlayer/tests/TerrainWalkerTests.cpp -o /tmp/terrain-walker-test
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 /tmp/terrain-walker-test
      - name: Verify bounded voxel edits and ray traversal under sanitizers
        run: |
          g++ -std=c++23 -Wall -Wextra -Wpedantic -Werror -g -O1 -fsanitize=address,undefined -fno-omit-frame-pointer Runtime/KairoPlayer/tests/VoxelInteractionTests.cpp -o /tmp/voxel-interaction-test
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 /tmp/voxel-interaction-test
      - name: Verify greedy voxel face coverage under sanitizers
        run: |
          g++ -std=c++23 -Wall -Wextra -Wpedantic -Werror -g -O1 -fsanitize=address,undefined -fno-omit-frame-pointer Runtime/KairoPlayer/tests/VoxelChunkSurfaceTests.cpp -o /tmp/voxel-surface-test
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 /tmp/voxel-surface-test
      - name: Validate seeded Craft world and mesh conversion
        run: |
          g++ -std=c++23 -Wall -Wextra -Wpedantic -Werror -g -O1 -fsanitize=address,undefined -fno-omit-frame-pointer Runtime/KairoPlayer/tests/CraftWorldTests.cpp -o /tmp/craft-world-test
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 /tmp/craft-world-test
      - name: Verify transactional multi-chunk publication
        run: |
          g++ -std=c++23 -Wall -Wextra -Wpedantic -Werror -g -O1 -fsanitize=address,undefined -fno-omit-frame-pointer Runtime/KairoPlayer/tests/VoxelMeshPublicationTests.cpp -o /tmp/voxel-publication-test
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 /tmp/voxel-publication-test
      - name: Verify Craft world save codec
        run: |
          g++ -std=c++23 -Wall -Wextra -Wpedantic -Werror -g -O1 -fsanitize=address,undefined -fno-omit-frame-pointer Runtime/KairoPlayer/tests/CraftSaveTests.cpp -o /tmp/craft-save-test
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 /tmp/craft-save-test
      - name: Verify voxel body collision under sanitizers
        run: |
          g++ -std=c++23 -Wall -Wextra -Wpedantic -Werror -g -O1 -fsanitize=address,undefined -fno-omit-frame-pointer Runtime/KairoPlayer/tests/VoxelPlayerTests.cpp -o /tmp/voxel-player-test
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 /tmp/voxel-player-test
      - name: Verify stable streamed voxel windows
        run: |
          g++ -std=c++23 -Wall -Wextra -Wpedantic -Werror -g -O1 -fsanitize=address,undefined -fno-omit-frame-pointer Runtime/KairoPlayer/tests/CraftStreamingWindowTests.cpp -o /tmp/craft-window-test
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 /tmp/craft-window-test
      - name: Verify streamed Craft save codec
        run: |
          g++ -std=c++23 -Wall -Wextra -Wpedantic -Werror -g -O1 -fsanitize=address,undefined -fno-omit-frame-pointer Runtime/KairoPlayer/tests/CraftStreamSaveTests.cpp -o /tmp/craft-stream-save-test
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 /tmp/craft-stream-save-test
      - name: Verify immutable voxel worker batches
        run: |
          g++ -std=c++23 -pthread -Wall -Wextra -Wpedantic -Werror -g -O1 -fsanitize=address,undefined -fno-omit-frame-pointer Runtime/KairoPlayer/tests/CraftMeshBatchTests.cpp -o /tmp/craft-batch-test
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 /tmp/craft-batch-test
      - name: Verify survival inventory and session persistence
        run: |
          g++ -std=c++23 -Wall -Wextra -Wpedantic -Werror -g -O1 -fsanitize=address,undefined -fno-omit-frame-pointer Runtime/KairoPlayer/tests/CraftInventoryTests.cpp -o /tmp/craft-inventory-test
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 /tmp/craft-inventory-test
      - name: Verify XYZ cave streaming and deterministic worker geometry
        run: |
          g++ -std=c++23 -pthread -Wall -Wextra -Wpedantic -Werror -g -O1 -fsanitize=address,undefined -fno-omit-frame-pointer Runtime/KairoPlayer/tests/CraftCaveWorldTests.cpp -o /tmp/craft-cave-test
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 /tmp/craft-cave-test
      - name: Verify recipe and hotbar layout transactions
        run: |
          g++ -std=c++23 -Wall -Wextra -Wpedantic -Werror -g -O1 -fsanitize=address,undefined -fno-omit-frame-pointer Runtime/KairoPlayer/tests/CraftRecipesHudTests.cpp -o /tmp/craft-recipes-hud-test
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 /tmp/craft-recipes-hud-test
      - name: Verify aspect-safe HUD projection under sanitizers
        run: |
          g++ -std=c++23 -Wall -Wextra -Wpedantic -Werror -g -O1 -fsanitize=address,undefined -fno-omit-frame-pointer Runtime/KairoPlayer/tests/CraftHudProjectionTests.cpp -o /tmp/craft-hud-projection-test
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 /tmp/craft-hud-projection-test
      - name: Verify native HUD publication cache under sanitizers
        run: |
          g++ -std=c++23 -Wall -Wextra -Wpedantic -Werror -g -O1 -fsanitize=address,undefined -fno-omit-frame-pointer Runtime/KairoPlayer/tests/CraftHudPublicationTests.cpp -o /tmp/craft-hud-publication-test
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 /tmp/craft-hud-publication-test
      - name: Verify survival fall damage and respawn state
        run: |
          g++ -std=c++23 -Wall -Wextra -Wpedantic -Werror -g -O1 -fsanitize=address,undefined -fno-omit-frame-pointer Runtime/KairoPlayer/tests/CraftVitalsTests.cpp -o /tmp/craft-vitals-test
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 /tmp/craft-vitals-test
      - name: Verify timed mining under sanitizers
        run: |
          g++ -std=c++23 -Wall -Wextra -Wpedantic -Werror -g -O1 -fsanitize=address,undefined -fno-omit-frame-pointer Runtime/KairoPlayer/tests/CraftMiningTests.cpp -o /tmp/craft-mining-test
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 /tmp/craft-mining-test
      - name: Verify equipment conservation and durability
        run: |
          g++ -std=c++23 -Wall -Wextra -Wpedantic -Werror -g -O1 -fsanitize=address,undefined -fno-omit-frame-pointer Runtime/KairoPlayer/tests/CraftEquipmentTests.cpp -o /tmp/craft-equipment-test
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 /tmp/craft-equipment-test
      - name: Verify equipment envelope under sanitizers
        run: |
          g++ -std=c++23 -Wall -Wextra -Wpedantic -Werror -g -O1 -fsanitize=address,undefined -fno-omit-frame-pointer Runtime/KairoPlayer/tests/CraftEquipmentEnvelopeTests.cpp -o /tmp/craft-equipment-envelope-test
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 /tmp/craft-equipment-envelope-test
  native-vulkan:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Materialize exact locked workspace
        run: |
          set -euo pipefail
          repos=(KairoMath KairoGeometry KairoSpatial KairoPhysicsMath KairoPhysicsEngine KairoAssets KairoAI KairoECS KairoReflection KairoEngineCore KairoRenderer KairoEditor)
          bash scripts/materialize_workspace_lock.sh "${repos[@]}"
          bash scripts/verify_workspace_lock.sh "${repos[@]}"
      - name: Install native software Vulkan and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang ninja-build libglfw3-dev libgl1-mesa-dev libvulkan-dev glslang-tools xvfb xauth mesa-vulkan-drivers vulkan-tools vulkan-validationlayers
          echo "KAIRO_CXX_COMPILER=$(command -v clang++)" >> "$GITHUB_ENV"
          icd="$(find /usr/share/vulkan/icd.d -maxdepth 1 -name '*lvp*.json' -print -quit)"
          test -n "$icd"
          echo "VK_DRIVER_FILES=$icd" >> "$GITHUB_ENV"
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
      - name: Compile procedural viewport against exact locked dependencies
        run: |
          cmake --preset game-player-clang -DKAIRO_PLAYER_BUILD_PROCEDURAL_TERRAIN=ON -DKAIRO_GAME_ENGINE_BUILD_PHASE1_SAMPLE=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build --preset game-player-clang --parallel 2 --target KairoCraftEquipmentEnvelopeTests KairoCraftEquipmentTests KairoCraftMiningTests KairoCraftVitalsTests KairoCraftHudPublicationTests KairoCraftHudProjectionTests KairoCraftRecipesHudTests KairoCraftCaves KairoCraftCaveWorldTests KairoCraftStream KairoCraftInventoryTests KairoCraftMeshBatchTests KairoCraftStreamSaveTests KairoCraft KairoCraftStreamingWindowTests KairoVoxelPlayerTests KairoCraftSaveTests KairoVoxelMeshPublicationTests KairoCraftWorldTests KairoVoxelChunkSurfaceTests KairoVoxelInteractionTests KairoTerrainDemo KairoTerrainExplorer KairoTerrainWalkerTests KairoTerrainNativeStoreTests KairoTerrainGenerationQueueTests KairoTerrainRenderOriginTests KairoTerrainErrorProfileTests KairoTerrainScreenErrorTests
      - name: Run required native streamed-terrain capture
        run: |
          set -euo pipefail
          mkdir -p build/terrain-diagnostics
          ctest --test-dir build/game-player-clang -R '^Kairo(Terrain(NativeStore|GenerationQueue|RenderOrigin|ErrorProfile|ScreenError|Walker)|VoxelInteraction|VoxelChunkSurface|CraftWorld|VoxelMeshPublication|CraftSave|VoxelPlayer|CraftStreamingWindow|CraftStreamSave|CraftMeshBatch|CraftInventory|CraftCaveWorld|CraftRecipesHud|CraftHudProjection|CraftHudPublication|CraftVitals|CraftMining|CraftEquipment|CraftEquipmentEnvelope)Tests$' --no-tests=error --output-on-failure
          export VK_INSTANCE_LAYERS=VK_LAYER_KHRONOS_validation
          xvfb-run -a --server-args="-screen 0 1280x1024x24" build/game-player-clang/Runtime/KairoPlayer/KairoTerrainDemo --renderer vulkan --seed 42 --smoke 2>&1 | tee build/terrain-diagnostics/smoke.log
          xvfb-run -a --server-args="-screen 0 1280x1024x24" build/game-player-clang/Runtime/KairoPlayer/KairoTerrainDemo --renderer vulkan --seed 42 --smoke --async 2>&1 | tee build/terrain-diagnostics/async-smoke.log
          xvfb-run -a --server-args="-screen 0 1280x1024x24" build/game-player-clang/Runtime/KairoPlayer/KairoTerrainDemo --renderer vulkan --seed 42 --smoke --workers 4 2>&1 | tee build/terrain-diagnostics/pool-smoke.log
          xvfb-run -a --server-args="-screen 0 1280x1024x24" build/game-player-clang/Runtime/KairoPlayer/KairoTerrainDemo --renderer vulkan --seed 42 --smoke --workers 4 --far-origin 2>&1 | tee build/terrain-diagnostics/far-smoke.log
          xvfb-run -a --server-args="-screen 0 1280x1024x24" build/game-player-clang/Runtime/KairoPlayer/KairoTerrainDemo --renderer vulkan --seed 42 --smoke --workers 4 --lod 2>&1 | tee build/terrain-diagnostics/lod-smoke.log
          xvfb-run -a --server-args="-screen 0 1280x1024x24" build/game-player-clang/Runtime/KairoPlayer/KairoTerrainDemo --renderer vulkan --seed 42 --smoke --workers 4 --error-mm 1000 2>&1 | tee build/terrain-diagnostics/error-smoke.log
          xvfb-run -a --server-args="-screen 0 1280x1024x24" build/game-player-clang/Runtime/KairoPlayer/KairoTerrainDemo --renderer vulkan --seed 42 --smoke --workers 4 --screen-px 20 2>&1 | tee build/terrain-diagnostics/screen-smoke.log
          xvfb-run -a --server-args="-screen 0 1280x1024x24" build/game-player-clang/Runtime/KairoPlayer/KairoTerrainExplorer --renderer vulkan --seed 42 --smoke 2>&1 | tee build/terrain-diagnostics/explorer-smoke.log
          xvfb-run -a --server-args="-screen 0 1280x1024x24" build/game-player-clang/Runtime/KairoPlayer/KairoCraft --renderer vulkan --seed 42 --smoke 2>&1 | tee build/terrain-diagnostics/craft-smoke.log
          xvfb-run -a --server-args="-screen 0 1280x1024x24" build/game-player-clang/Runtime/KairoPlayer/KairoCraft --renderer vulkan --seed 42 --survival --smoke 2>&1 | tee build/terrain-diagnostics/craft-survival-smoke.log
          xvfb-run -a --server-args="-screen 0 1280x1024x24" build/game-player-clang/Runtime/KairoPlayer/KairoCraftStream --renderer vulkan --seed 42 --survival --smoke 2>&1 | tee build/terrain-diagnostics/craft-stream-smoke.log
          xvfb-run -a --server-args="-screen 0 1280x1024x24" build/game-player-clang/Runtime/KairoPlayer/KairoCraftStream --renderer vulkan --seed 42 --survival --workers 4 --uploads 2 --smoke 2>&1 | tee build/terrain-diagnostics/craft-async-smoke.log
          xvfb-run -a --server-args="-screen 0 1280x1024x24" build/game-player-clang/Runtime/KairoPlayer/KairoCraftCaves --renderer vulkan --seed 42 --smoke 2>&1 | tee build/terrain-diagnostics/craft-caves-smoke.log
          if grep -E 'Validation Error|VUID-.*ERROR|UNASSIGNED-.*ERROR' build/terrain-diagnostics/*smoke.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: streamed-terrain-diagnostics
          path: build/terrain-diagnostics/
          if-no-files-found: warn
  native-metal:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Materialize and verify exact candidate lock
        run: |
          set -euo pipefail
          repos=(KairoMath KairoGeometry KairoSpatial KairoPhysicsMath KairoPhysicsEngine KairoAssets KairoAI KairoECS KairoReflection KairoEngineCore KairoRenderer KairoEditor)
          bash scripts/materialize_workspace_lock.sh "${repos[@]}"
          bash scripts/verify_workspace_lock.sh "${repos[@]}"
      - name: Install native macOS build dependencies
        run: |
          set -euo pipefail
          brew update
          brew install cmake ninja llvm glfw vulkan-headers vulkan-loader molten-vk shaderc glslang
          echo "KAIRO_CXX_COMPILER=$(brew --prefix llvm)/bin/clang++" >> "$GITHUB_ENV"
      - name: Run exact-lock native Metal gameplay acceptance
        env:
          KAIRO_METAL_LOG_DIR: build/metal-diagnostics
        run: |
          bash -n scripts/run_native_metal_gameplay_acceptance.sh
          bash scripts/run_native_metal_gameplay_acceptance.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: locked-metal-gameplay-diagnostics
          path: build/metal-diagnostics/
          if-no-files-found: warn
