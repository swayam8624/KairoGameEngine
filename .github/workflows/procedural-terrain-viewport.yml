      - 'Runtime/KairoPlayer/tests/CraftSurfaceSpawnTests.cpp'
      - 'Runtime/KairoPlayer/tests/CraftNutritionTests.cpp'
      - 'Runtime/KairoPlayer/tests/CraftSurvivalJourneyTests.cpp'
      - 'Runtime/KairoPlayer/CraftSaveFile.hpp'
      - 'Runtime/KairoPlayer/tests/CraftSaveFileTests.cpp'
      - 'Runtime/KairoPlayer/CraftDaylight.hpp'
      - 'Runtime/KairoPlayer/tests/CraftDaylightTests.cpp'
      - 'Runtime/KairoPlayer/CraftTargetFeedback.hpp'
      - 'Runtime/KairoPlayer/tests/CraftTargetFeedbackTests.cpp'
      - 'Runtime/KairoPlayer/CraftAutosave.hpp'
      - 'Runtime/KairoPlayer/tests/CraftAutosaveTests.cpp'
      - 'Runtime/KairoPlayer/CraftCreature.hpp'
      - 'Runtime/KairoPlayer/tests/CraftCreatureTests.cpp'
      - 'Runtime/KairoPlayer/CraftCreatureNavigation.hpp'
      - 'Runtime/KairoPlayer/tests/CraftCreatureNavigationTests.cpp'
      - 'Runtime/KairoPlayer/CraftCombatReward.hpp'
      - 'Runtime/KairoPlayer/tests/CraftCombatRewardTests.cpp'
      - 'Runtime/KairoPlayer/CraftCombatHud.hpp'
      - 'Runtime/KairoPlayer/tests/CraftCombatHudTests.cpp'
      - 'Runtime/KairoPlayer/CraftMining.hpp'
      - 'Runtime/KairoPlayer/CraftEquipment.hpp'
      - 'Runtime/KairoPlayer/CraftMouseLook.hpp'
      - 'Runtime/KairoPlayer/CraftActionLatch.hpp'
      - 'Runtime/KairoPlayer/tests/CraftActionLatchTests.cpp'
      - 'Runtime/KairoPlayer/tests/CraftMouseLookTests.cpp'
      - 'Runtime/KairoPlayer/CraftEquipmentSave.hpp'
      - 'Runtime/KairoPlayer/tests/CraftEquipmentTests.cpp'
      - 'Runtime/KairoPlayer/tests/CraftEquipmentEnvelopeTests.cpp'
      - 'Runtime/KairoPlayer/tests/CraftMiningTests.cpp'
      - 'Runtime/KairoPlayer/tests/CraftVitalsTests.cpp'
      - 'Runtime/KairoPlayer/tests/CraftHudPublicationTests.cpp'
      - 'Runtime/KairoPlayer/tests/CraftHudProjectionTests.cpp'
      - 'Runtime/KairoPlayer/tests/CraftRecipesHudTests.cpp'
      - 'Runtime/KairoPlayer/CraftCaveSession.hpp'
      - 'Runtime/KairoPlayer/CraftCaveSpawn.hpp'
      - 'Runtime/KairoPlayer/CraftCaveWorld.hpp'
      - 'Runtime/KairoPlayer/CraftCaveDemo.cpp'
      - 'Runtime/KairoPlayer/tests/CraftCaveWorldTests.cpp'
      - 'Runtime/KairoPlayer/CraftInventory.hpp'
      - 'Runtime/KairoPlayer/tests/CraftInventoryTests.cpp'
      - 'Runtime/KairoPlayer/CraftMeshBatch.hpp'
      - 'Runtime/KairoPlayer/tests/CraftMeshBatchTests.cpp'
      - 'Runtime/KairoPlayer/CraftStreamSave.hpp'
      - 'Runtime/KairoPlayer/tests/CraftStreamSaveTests.cpp'
      - 'Runtime/KairoPlayer/CraftStreamDemo.cpp'
      - 'Runtime/KairoPlayer/CraftStreamingWindow.hpp'
      - 'Runtime/KairoPlayer/tests/CraftStreamingWindowTests.cpp'
      - 'Runtime/KairoPlayer/VoxelPlayer.hpp'
      - 'Runtime/KairoPlayer/tests/VoxelPlayerTests.cpp'
