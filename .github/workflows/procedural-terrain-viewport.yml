      - 'Runtime/KairoPlayer/CraftHudProjection.hpp'
      - 'Runtime/KairoPlayer/CraftHudPublication.hpp'
      - 'Runtime/KairoPlayer/CraftVitals.hpp'
      - 'Runtime/KairoPlayer/CraftNutrition.hpp'
