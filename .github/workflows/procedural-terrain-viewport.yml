name: Procedural terrain viewport
on:
  push:
    branches: [main, integration/merged-terrain-renderer, feat/terrain-live-lod]
  pull_request:
    paths:
      - 'workspace.lock'
      - 'Runtime/KairoPlayer/TerrainRenderOrigin.hpp'
      - 'Runtime/KairoPlayer/tests/TerrainRenderOriginTests.cpp'
      - 'Runtime/KairoPlayer/TerrainGenerationQueue.hpp'
      - 'Runtime/KairoPlayer/tests/TerrainGenerationQueueTests.cpp'
      - 'Runtime/KairoPlayer/TerrainNativeStore.hpp'
      - 'Runtime/KairoPlayer/RuntimeProceduralTerrainBridge.cppm'
      - 'Runtime/KairoPlayer/TerrainDemo.cpp'
      - 'Runtime/KairoPlayer/tests/TerrainNativeStoreTests.cpp'
      - 'Runtime/KairoPlayer/CMakeLists.txt'
      - '.github/workflows/procedural-terrain-viewport.yml'
permissions:
  contents: read
jobs:
  ownership:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate native handle ownership under sanitizers
        run: |
          g++ -std=c++23 -Wall -Wextra -Wpedantic -Werror -g -O1 -fsanitize=address,undefined -fno-omit-frame-pointer Runtime/KairoPlayer/tests/TerrainNativeStoreTests.cpp -o /tmp/terrain-native-test
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 /tmp/terrain-native-test
      - name: Validate bounded worker queue under sanitizers
        run: |
          g++ -std=c++23 -Wall -Wextra -Wpedantic -Werror -g -O1 -pthread -fsanitize=address,undefined -fno-omit-frame-pointer Runtime/KairoPlayer/tests/TerrainGenerationQueueTests.cpp -o /tmp/terrain-queue-test
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 /tmp/terrain-queue-test
      - name: Validate large-world precision under sanitizers
        run: |
          g++ -std=c++23 -Wall -Wextra -Wpedantic -Werror -g -O1 -fsanitize=address,undefined -fno-omit-frame-pointer Runtime/KairoPlayer/tests/TerrainRenderOriginTests.cpp -o /tmp/terrain-origin-test
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 /tmp/terrain-origin-test
  native-vulkan:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Materialize exact locked workspace
        run: |
          set -euo pipefail
          repos=(KairoMath KairoGeometry KairoSpatial KairoPhysicsMath KairoPhysicsEngine KairoAssets KairoAI KairoECS KairoReflection KairoEngineCore KairoRenderer KairoEditor)
          bash scripts/materialize_workspace_lock.sh "${repos[@]}"
          bash scripts/verify_workspace_lock.sh "${repos[@]}"
          # Temporary review-only override; release lock remains the merged revision.
          candidate=9f067b204bf42010412f7f9318cd26985ee7618b
          git -C ../KairoEngineCore fetch --no-tags origin "$candidate"
          git -C ../KairoEngineCore checkout --detach "$candidate"
          test "$(git -C ../KairoEngineCore rev-parse HEAD)" = "$candidate"
      - name: Install native software Vulkan and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang ninja-build libglfw3-dev libgl1-mesa-dev libvulkan-dev glslang-tools xvfb xauth mesa-vulkan-drivers vulkan-tools vulkan-validationlayers
          echo "KAIRO_CXX_COMPILER=$(command -v clang++)" >> "$GITHUB_ENV"
          icd="$(find /usr/share/vulkan/icd.d -maxdepth 1 -name '*lvp*.json' -print -quit)"
          test -n "$icd"
          echo "VK_DRIVER_FILES=$icd" >> "$GITHUB_ENV"
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
      - name: Compile procedural viewport against explicit LOD review candidate
        run: |
          cmake --preset game-player-clang -DKAIRO_PLAYER_BUILD_PROCEDURAL_TERRAIN=ON -DKAIRO_GAME_ENGINE_BUILD_PHASE1_SAMPLE=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build --preset game-player-clang --parallel 2 --target KairoTerrainDemo KairoTerrainNativeStoreTests KairoTerrainGenerationQueueTests KairoTerrainRenderOriginTests
      - name: Run required native streamed-terrain capture
        run: |
          set -euo pipefail
          mkdir -p build/terrain-diagnostics
          ctest --test-dir build/game-player-clang -R '^KairoTerrain(NativeStore|GenerationQueue|RenderOrigin)Tests$' --output-on-failure
          export VK_INSTANCE_LAYERS=VK_LAYER_KHRONOS_validation
          xvfb-run -a --server-args="-screen 0 1280x1024x24" build/game-player-clang/Runtime/KairoPlayer/KairoTerrainDemo --renderer vulkan --seed 42 --smoke 2>&1 | tee build/terrain-diagnostics/smoke.log
          xvfb-run -a --server-args="-screen 0 1280x1024x24" build/game-player-clang/Runtime/KairoPlayer/KairoTerrainDemo --renderer vulkan --seed 42 --smoke --async 2>&1 | tee build/terrain-diagnostics/async-smoke.log
          xvfb-run -a --server-args="-screen 0 1280x1024x24" build/game-player-clang/Runtime/KairoPlayer/KairoTerrainDemo --renderer vulkan --seed 42 --smoke --workers 4 2>&1 | tee build/terrain-diagnostics/pool-smoke.log
          xvfb-run -a --server-args="-screen 0 1280x1024x24" build/game-player-clang/Runtime/KairoPlayer/KairoTerrainDemo --renderer vulkan --seed 42 --smoke --workers 4 --far-origin 2>&1 | tee build/terrain-diagnostics/far-smoke.log
          xvfb-run -a --server-args="-screen 0 1280x1024x24" build/game-player-clang/Runtime/KairoPlayer/KairoTerrainDemo --renderer vulkan --seed 42 --smoke --workers 4 --lod 2>&1 | tee build/terrain-diagnostics/lod-smoke.log
          if grep -E 'Validation Error|VUID-.*ERROR|UNASSIGNED-.*ERROR' build/terrain-diagnostics/*smoke.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: streamed-terrain-diagnostics
          path: build/terrain-diagnostics/
          if-no-files-found: warn
