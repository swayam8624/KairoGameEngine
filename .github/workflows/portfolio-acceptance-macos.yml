name: Full macOS Portfolio Acceptance

on:
  pull_request:
    paths:
      - '.github/workflows/portfolio-acceptance-macos.yml'
      - 'scripts/run_portfolio_acceptance.sh'
      - 'scripts/verify_portfolio_95.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kairo-host-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-head-acceptance:
    name: Native macOS host acceptance
    runs-on: macos-latest
    timeout-minutes: 180
    env:
      PYTHONWARNINGS: error

    steps:
      - uses: actions/checkout@v7

      - name: Materialize every pinned sibling repository
        shell: bash
        run: |
          bash scripts/materialize_workspace_lock.sh
          bash scripts/verify_workspace_lock.sh

      - name: Install desktop build, rendering and DCC prerequisites
        shell: bash
        run: |
          brew install cmake ninja llvm glfw vulkan-headers vulkan-loader molten-vk shaderc glslang
          if [[ ! -x /Applications/Blender.app/Contents/MacOS/Blender ]]; then
            brew install --cask blender
          fi
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "CC=$(brew --prefix llvm)/bin/clang" >> "$GITHUB_ENV"
          echo "CXX=$(brew --prefix llvm)/bin/clang++" >> "$GITHUB_ENV"
          echo "KAIRO_CXX_COMPILER=$(brew --prefix llvm)/bin/clang++" >> "$GITHUB_ENV"

      - name: Record exact input revisions and native toolchains
        shell: bash
        run: |
          mkdir -p build/portfolio-evidence
          {
            git rev-parse HEAD
            shasum -a 256 workspace.lock
            cmake --version
            "$KAIRO_CXX_COMPILER" --version
            swift --version
            cargo --version
            npm --version
            /Applications/Blender.app/Contents/MacOS/Blender --version | head -n 2
          } > build/portfolio-evidence/toolchains.txt

      - name: Run full native host acceptance campaign
        shell: bash
        run: bash scripts/run_portfolio_acceptance.sh

      - name: Check host stamp belongs to this exact GameEngine commit and lock
        shell: bash
        run: bash scripts/verify_portfolio_95.sh

      - name: Upload acceptance evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kairo-native-macos-portfolio-acceptance
          path: |
            build/portfolio-evidence/
            build/dev-clang/integration-build.log
            build/dev-clang/integration-warnings.log
            build/dev-clang/Testing/Temporary/LastTest.log
          if-no-files-found: warn
