name: Wire Phase 12 Player runtime
on:
  push:
    branches:
      - agent/phases6-12-integration
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/phases6-12-integration
      - run: python3 .github/scripts/wire_production_player.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Run Phase 12 production systems in Player"
          git push
