name: Windows Studio isolated runtime qualification

on:
  pull_request:
    paths:
      - 'scripts/windows_studio_runtime_gate.py'
      - '.github/workflows/windows-isolated-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  exact-windows-studio:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: actions/download-artifact@v5
        with:
          name: KairoStudio-windows-msvc
          path: qualified-windows
          run-id: 46119943618
          github-token: ${{ github.token }}
          repository: swayam8624/KairoGameEngine
      - name: Prepare explicit host runtime prerequisites, not a redistributable bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vcpkg = $env:VCPKG_INSTALLATION_ROOT
          if (-not $vcpkg) { $vcpkg = 'C:\vcpkg' }
          & "$vcpkg\bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE -ne 0) { throw 'vcpkg bootstrap failed' }
          & "$vcpkg\vcpkg.exe" install glfw3 vulkan-loader --triplet x64-windows
          if ($LASTEXITCODE -ne 0) { throw 'Runtime prerequisite acquisition failed' }
          $packages = & "$vcpkg\vcpkg.exe" list
          if ($LASTEXITCODE -ne 0) { throw 'vcpkg inventory failed' }
          $packages | Write-Output
          if (-not ($packages -match '^glfw3:x64-windows\s+3\.5\.1\s')) { throw 'GLFW version differs from original build' }
          if (-not ($packages -match '^vulkan-loader:x64-windows\s+1\.4\.363\.0#1\s')) { throw 'Vulkan loader version differs from original build' }
          $runtime = Join-Path $env:RUNNER_TEMP 'Kairo runtime prerequisites'
          New-Item -ItemType Directory -Path $runtime | Out-Null
          foreach ($dll in @('glfw3.dll', 'vulkan-1.dll')) {
              Copy-Item -LiteralPath "$vcpkg\installed\x64-windows\bin\$dll" -Destination $runtime
          }
          "KAIRO_RUNTIME_ROOT=$runtime" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Run exact installed Studio on isolated runtime PATH
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $work = Join-Path $env:RUNNER_TEMP 'Kairo isolated work'
          New-Item -ItemType Directory -Path $work | Out-Null
          python -B scripts/windows_studio_runtime_gate.py qualified-windows $work $env:KAIRO_RUNTIME_ROOT
          if ($LASTEXITCODE -ne 0) { throw 'Isolated native Studio validation failed' }
