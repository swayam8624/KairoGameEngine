name: M50 Android acceptance
on:
  pull_request:
    paths:
      - 'Samples/AndroidPlatformer/**'
      - 'Samples/WebPlatformer/PlatformerWasm.cpp'
      - 'Runtime/KairoPlayer/RuntimePlatformerCore.hpp'
      - 'scripts/test_android_host.py'
      - 'scripts/run_android_emulator_smoke.sh'
      - '.github/workflows/m50-android.yml'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Samples/AndroidPlatformer/**'
      - 'Samples/WebPlatformer/PlatformerWasm.cpp'
      - 'Runtime/KairoPlayer/RuntimePlatformerCore.hpp'
      - 'scripts/test_android_host.py'
      - 'scripts/run_android_emulator_smoke.sh'
      - '.github/workflows/m50-android.yml'
permissions:
  contents: read
jobs:
  host-jni:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: python3 scripts/test_android_host.py --compiler "${{ matrix.compiler }}"
  android-emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install pinned Android toolchain
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Build native Android APK
        run: gradle -p Samples/AndroidPlatformer :app:assembleDebug --no-daemon
      - name: Enable KVM for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          script: bash scripts/run_android_emulator_smoke.sh Samples/AndroidPlatformer/app/build/outputs/apk/debug/app-debug.apk android-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kairo-android-debug-evidence
          path: |
            Samples/AndroidPlatformer/app/build/outputs/apk/debug/app-debug.apk
            android-evidence/
